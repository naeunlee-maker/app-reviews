name: 매일 리뷰 수집

on:
  schedule:
     - cron: '17 3 * * *'
     - cron: '47 3 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 리포 체크아웃
        uses: actions/checkout@v4
      
      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 패키지 설치
        run: pip install -r requirements.txt
      
      - name: 리뷰 수집
        run: python collect_all.py
      
      - name: 깃에 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.js
          git diff --staged --quiet || git commit -m "자동 갱신: $(date +'%Y-%m-%d %H:%M')"
          git push
